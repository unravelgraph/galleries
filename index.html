<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>unravel's graph galleries</title> 
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>
<div id="navbar"></div>

<h1>Galleries</h1>
<div class="allfilters">
    
    <div id="filters"></div>
    
    <div id="age-filter">
        
        <span id="age-min-value"></span>

        <input 
            type="range"
            id="min-age"
            min="18"
            max="100"
            value="18"
        >

        <input 
            type="range"
            id="max-age"
            min="18"
            max="100"
            value="100"
        >

        <span id="age-max-value"></span>

    </div>

</div>


<div id="gallery-grid"></div>

<script src="components/navbar.js"></script>
<script src="components/isotope.pkgd.min.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>


</body>
</html>
